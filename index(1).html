<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6B4E71">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mood Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Mood Tracker</h1>
            <div id="current-date"></div>
        </header>

        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="check-in">Check In</button>
            <button class="tab-btn" data-tab="calendar">Calendar</button>
            <button class="tab-btn" data-tab="journal">Journal</button>
        </nav>

        <!-- Check In Tab -->
        <div id="check-in" class="tab-content active">
            <div class="mood-check-container">
                <div class="check-in-section">
                    <h2>Breakfast</h2>
                    <div class="mood-buttons" data-meal="breakfast">
                        <button class="mood-btn" data-mood="good"><img src="good.png" alt="Good"><span>Good</span></button>
                        <button class="mood-btn" data-mood="neutral"><img src="neutral.png" alt="Neutral"><span>Neutral</span></button>
                        <button class="mood-btn" data-mood="bad"><img src="bad.png" alt="Bad"><span>Bad</span></button>
                    </div>
                    <div class="check-status" data-meal="breakfast"></div>
                </div>

                <div class="check-in-section">
                    <h2>Lunch</h2>
                    <div class="mood-buttons" data-meal="lunch">
                        <button class="mood-btn" data-mood="good"><img src="good.png" alt="Good"><span>Good</span></button>
                        <button class="mood-btn" data-mood="neutral"><img src="neutral.png" alt="Neutral"><span>Neutral</span></button>
                        <button class="mood-btn" data-mood="bad"><img src="bad.png" alt="Bad"><span>Bad</span></button>
                    </div>
                    <div class="check-status" data-meal="lunch"></div>
                </div>

                <div class="check-in-section">
                    <h2>Dinner</h2>
                    <div class="mood-buttons" data-meal="dinner">
                        <button class="mood-btn" data-mood="good"><img src="good.png" alt="Good"><span>Good</span></button>
                        <button class="mood-btn" data-mood="neutral"><img src="neutral.png" alt="Neutral"><span>Neutral</span></button>
                        <button class="mood-btn" data-mood="bad"><img src="bad.png" alt="Bad"><span>Bad</span></button>
                    </div>
                    <div class="check-status" data-meal="dinner"></div>
                </div>

                <div class="daily-average">
                    <h3>Today's Average</h3>
                    <div id="average-display">No check-ins yet</div>
                </div>

                <div class="daily-notes-section">
                    <h3>Daily Notes</h3>
                    <textarea id="daily-notes" placeholder="Quick notes for today..."></textarea>
                </div>
            </div>
        </div>

        <!-- Calendar Tab -->
        <div id="calendar" class="tab-content">
            <div class="calendar-controls">
                <button id="prev-month">‹</button>
                <h2 id="calendar-month"></h2>
                <button id="next-month">›</button>
            </div>
            <div id="calendar-grid"></div>
            <div id="day-detail" class="day-detail hidden">
                <button id="close-detail">×</button>
                <h3 id="detail-date"></h3>
                <div id="detail-moods"></div>
                <div id="detail-notes"></div>
            </div>
        </div>

        <!-- Journal Tab -->
        <div id="journal" class="tab-content">
            <div class="journal-controls">
                <button id="new-entry-btn">New Entry</button>
            </div>
            <div id="journal-entries"></div>
            
            <div id="journal-editor" class="journal-editor hidden">
                <button id="close-editor">×</button>
                <input type="text" id="entry-title" placeholder="Title (optional)">
                <textarea id="entry-content" placeholder="Write your thoughts..."></textarea>
                <div class="editor-buttons">
                    <button id="save-entry">Save</button>
                    <button id="cancel-entry">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
